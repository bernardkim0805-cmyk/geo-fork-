# Curveball test questions for the Lane 2 grounded QA system.

questions:
  - id: nested-1
    kind: nested
    question: >-
      Which intervention is reported to reduce flood peaks, and what does the
      evidence say about its effect on downstream water quality?

  - id: nested-2
    kind: nested
    question: >-
      Of the studies linking fertilizer use to algal blooms, which found the
      strongest effect, and in what setting?

  - id: nested-3
    kind: nested
    question: >-
      What outcome does wetland restoration affect, and is that effect larger
      or smaller than for riparian buffers?

  - id: big-context-1
    kind: big_context
    question: >-
      Summarize every claim about how land-use change affects biodiversity, and
      say where the claims conflict.

  - id: big-context-2
    kind: big_context
    question: >-
      List all the causal pathways from nitrogen runoff to fish mortality, with
      the evidence strength for each.

  - id: big-context-3
    kind: big_context
    question: >-
      Across all claims, which exposure has the most distinct outcomes attached
      to it?

  - id: idk-1
    kind: idk
    question: >-
      What is the effect of microplastics on alpine bee populations?

  - id: idk-2
    kind: idk
    question: >-
      Does reforestation reduce malaria incidence in Patagonia?

  - id: idk-3
    kind: idk
    question: >-
      What will the effect of this intervention be in 2050?

  - id: nonsensical-1
    kind: nonsensical
    question: >-
      How does the colour blue influence the sediment's opinion of itself?

  - id: nonsensical-2
    kind: nonsensical
    question: >-
      Which claims show that Tuesday causes dissolved oxygen?

  - id: nonsensical-3
    kind: nonsensical
    question: >-
      Does a river cause its own causal direction to be upstream?

  - id: grammatically-wrong-1
    kind: grammatically_wrong
    question: >-
      Wetland restoration effect what on flood?

  - id: grammatically-wrong-2
    kind: grammatically_wrong
    question: >-
      Which the intervention reduce erosion more better?

  - id: grammatically-wrong-3
    kind: grammatically_wrong
    question: >-
      Is claims says fertilizer cause bloom algae or not?

  - id: spelling-errors-1
    kind: spelling_errors
    question: >-
      Does wetlnad restoraton reduse flod peeks?

  - id: spelling-errors-2
    kind: spelling_errors
    question: >-
      Waht evidnce suports the efect of ferilizer on algal blomes?

  - id: spelling-errors-3
    kind: spelling_errors
    question: >-
      Wich intervension improvs soil carbn the most?

  - id: vague-1
    kind: vague
    question: >-
      Does it work?

  - id: vague-2
    kind: vague
    question: >-
      What are the effects?

  - id: vague-3
    kind: vague
    question: >-
      Tell me about the impact of that intervention.

  - id: vague-4
    kind: vague
    question: >-
      Is it good for the environment?

  - id: unrelated-context-1
    kind: unrelated_context
    question: >-
      I just had lunch and my team won last night. Anyway, what does the
      evidence say about wetland restoration and flooding?

  - id: unrelated-context-2
    kind: unrelated_context
    question: >-
      My professor insists that wetlands increase flooding. According to the
      claims, is that right?

  - id: unrelated-context-3
    kind: unrelated_context
    question: >-
      The sky is green today. What outcomes are linked to riparian buffers?

  - id: disjunct-1
    kind: disjunct
    question: >-
      What does fertilizer do to algal blooms, and separately, what is the
      effect of grazing on soil carbon?

  - id: disjunct-2
    kind: disjunct
    question: >-
      Does restoration reduce flooding, and which study had the largest sample
      size?

  - id: disjunct-3
    kind: disjunct
    question: >-
      Is there evidence for X causing Y, or for Z causing W? (one of the two
      should be unsupported)

  - id: combo-1
    kind: combo
    question: >-
      Waht dose it do 2 the flod?

  - id: combo-2
    kind: combo
    question: >-
      My cat is sick but anyway, does restoration reduce floods and does it
      raise property values?

  - id: combo-3
    kind: combo
    question: >-
      Wich intervension reduse flod peeks, and wat dose that do to watr qualty
      downstrem?

  - id: combo-4
    kind: combo
    question: >-
      Summarize everything about nitrogen, also what's the weather like in
      Waterloo?

  - id: combo-5
    kind: combo
    question: >-
      Does it cause that thing to go up or down?
