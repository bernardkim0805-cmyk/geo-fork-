function parseCard(p, kind) {
  return `<div class="card">
      <div class="card-head">
        <span class="card-head-label">Parse detail</span>
        <span class="card-head-tag badge badge-grey">${esc(p.method || '?')}</span>
      </div>
      <div class="kv">
        <div><span>mode</span><b>${esc(p.mode || 'effect')}</b></div>
        ${kind ? `<div><span>kind (from yaml)</span><b>${esc(kind)}</b></div>` : ''}
        <div><span>interventions (X)</span><b>${(p.interventions || []).map(x => `<i>${esc(x)}</i>`).join(' ') || '—'}</b></div>
        <div><span>outcomes (Y)</span><b>${(p.outcomes || []).map(x => `<i>${esc(x)}</i>`).join(' ') || '—'}</b></div>
        <div><span>pairs</span><b>${(p.pairs || []).map(pr => `<i>${esc(pr[0])} → ${esc(pr[1])}</i>`).join(' ') || '—'}</b></div>
        ${p.presumed && Object.keys(p.presumed).length
          ? `<div><span>presumed direction</span><b>${esc(JSON.stringify(p.presumed))}</b></div>` : ''}
      </div>
    </div>`;
}

function stageHead(id, n, name, sub) {
  return `<div class="stage-head" id="st-${id}"><span class="stage-n">${n}</span>
    <span class="stage-name">${name}</span><span class="stage-sub">${sub}</span></div>`;
}

function confMeter(c) {
  if (c == null) return '—';
  const pc = Math.round(c * 100);
  return `<span class="conf-bar-wrap"><span class="conf-bar"><span class="conf-fill" style="width:${pc}%;display:block"></span></span><b>${pc}%</b></span>`;
}

// --- Decide ----------------------------------------------------------------
const VOTE_CLS = {increase:'inc', decrease:'dec', no_effect:'neu', abstain:'abs'};
const VOTE_TXT = {increase:'▲ increase', decrease:'▼ decrease', no_effect:'= no effect', abstain:'· abstain'};
function voteBadge(dir) {
  if (dir == null) return `<span class="vb vb-x">✕ excluded</span>`;
  return `<span class="vb vb-${VOTE_CLS[dir] || 'abs'}">${VOTE_TXT[dir] || esc(dir)}</span>`;
}
function shortDoc(doc) { return trunc(doc || '?', 28); }

function shareBar(share, total) {
  const keys = ['increase', 'decrease', 'no_effect'];
  const sum = total ?? keys.reduce((s, k) => s + (share[k] || 0), 0);
  if (!sum) return `<div class="sb"><div class="sb-empty">no readable direction</div></div>`;
  return `<div class="sb">${keys.filter(k => share[k]).map(k =>
    `<div class="sb-${VOTE_CLS[k]}" style="width:${(100 * share[k] / sum).toFixed(1)}%" title="${k} ${(100 * share[k] / sum).toFixed(0)}%"></div>`).join('')}</div>`;
}

let _votes = [];
function toggleVote(k) {
  const row = document.getElementById('vd-' + k);
  if (row) row.style.display = row.style.display === 'none' ? '' : 'none';
}

function renderDecide(d) {
  const votes = d.votes || [];
  const x = d.explain || {};
  _votes = votes;

  if (d.status !== 'answered') {
    return `<div class="card">
      <div class="card-head"><span class="card-head-label">Verdict</span>${statusBadge(d.status)}</div>
      <div class="answer-box">
        ${votes.length
          ? `Retrieve found ${votes.length} edge${votes.length > 1 ? 's' : ''}, but none states X's direct effect on the level of Y, so none can vote.`
          : `Retrieve found no edges. Decide trusts that (rule D3) and answers <b>no_evidence</b>.`}
        <div class="dc-why">Confidence ${Math.round((d.confidence || 0) * 100)}% that the graph really has nothing: the calibrated rate for no-evidence calls.</div>
      </div>
      ${votes.length ? renderVoteTable(votes) : ''}
      ${d.searched_for ? `<div class="pr-foot">Searched for: ${esc(d.searched_for)}</div>` : ''}
    </div>`;
  }

  const counted = votes.filter(v => v.direction && v.direction !== 'abstain').length;
  const papers = x.papers || [];
  const totals = x.totals || {};
  const totalW = Object.values(totals).reduce((a, b) => a + b, 0);
  const top = Object.entries(totals).sort((a, b) => b[1] - a[1])[0] || ['—', 0];
  const maj = x.majority ?? 0.66;

  return `
  <div class="card">
    <div class="card-head">
      <span class="card-head-label">Step 1 · Read each edge</span>
      <span class="card-head-tag badge badge-grey">${votes.length} edges · ${counted} vote</span>
      <span class="ch-note">direction = subject sign × predicate sign × object sign · weight = comparator × language × design × strength</span>
    </div>
    ${renderVoteTable(votes)}
  </div>

  <div class="card">
    <div class="card-head">
      <span class="card-head-label">Step 2 · One vote per paper</span>
      <span class="card-head-tag badge badge-grey">${papers.length} papers${x.sat_out ? ` · ${x.sat_out} sat out` : ''}</span>
      <span class="ch-note">a paper with 10 edges still counts once, at the weight of its strongest edge</span>
    </div>
    <table class="dv">
      <tr><th>Paper</th><th>Its edges split</th><th>Paper says</th><th class="n">weight</th><th>best grade</th><th>flags</th></tr>
      ${papers.map(pp => `<tr>
        <td class="dv-doc" title="${esc(pp.doc)}">${esc(shortDoc(pp.doc))}</td>
        <td style="min-width:140px">${shareBar(pp.share)}</td>
        <td>${pp.label === 'mixed' || pp.label === 'unclear' ? `<span class="vb vb-abs">${esc(pp.label)}</span>` : voteBadge(pp.label)}</td>
        <td class="n">${pp.weight}</td>
        <td class="dv-g">${esc(pp.grade)}</td>
        <td>${pp.head_to_head ? '<span class="ab-flag">head-to-head</span>' : ''}${pp.associative ? '<span class="ab-flag">associational</span>' : ''}${pp.observational ? '<span class="ab-flag">observational</span>' : ''}</td>
      </tr>`).join('')}
    </table>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="card-head-label">Step 3 · Combine papers</span>
      ${dirBadge(d.direction)}
    </div>
    <div class="dc-combine">
      <div class="dc-bar-wrap">
        ${shareBar(totals, totalW)}
        <div class="dc-maj" style="left:${maj * 100}%"><span>${Math.round(maj * 100)}% needed</span></div>
      </div>
      <div class="dc-legend">${['increase','decrease','no_effect'].filter(k => totals[k]).map(k =>
        `<span><i class="sw-${VOTE_CLS[k]}"></i>${k.replace('_', ' ')} ${totals[k].toFixed(2)} (${Math.round(100 * totals[k] / totalW)}%)</span>`).join('')}</div>
      <div class="dc-why">
        ${d.direction === 'mixed'
          ? `The biggest side, <b>${esc(top[0])}</b>, holds ${Math.round(100 * (x.top_share || 0))}% of the weighted vote, below the ${Math.round(maj * 100)}% majority → <b>mixed</b>.`
          : d.direction === 'unclear'
          ? `No paper has a readable up/down direction → <b>unclear</b>.`
          : `<b>${esc(d.direction)}</b> holds ${Math.round(100 * (x.top_share || 0))}% of the weighted vote (≥ ${Math.round(maj * 100)}%), and ${x.agreeing} of ${papers.length} papers say so.`}
      </div>
    </div>
  </div>

  <div class="dc-two">
    <div class="card">
      <div class="card-head"><span class="card-head-label">Step 4 · Certainty</span>
        <span class="card-head-tag badge badge-grey">${esc(d.certainty)}</span>
        <span class="ch-note">how strong the evidence is</span></div>
      <div class="steps">${(x.certainty_steps || []).map(s =>
        `<div class="st"><span>${esc(s.step)}</span><b>${esc(s.level)}</b></div>`).join('')}</div>
    </div>
    <div class="card">
      <div class="card-head"><span class="card-head-label">Step 5 · Confidence</span>
        <span class="card-head-tag badge badge-grey">${Math.round((d.confidence || 0) * 100)}%</span>
        <span class="ch-note">probability this answer is right</span></div>
      <div class="steps">${(x.confidence_steps || []).map(s =>
        `<div class="st"><span>${esc(s.step)}</span><b>${s.value}</b></div>`).join('')}</div>
    </div>
  </div>

  ${(d.notes && d.notes.length) || (d.d2 && (d.d2.calls || d.d2.cache_hits || d.d2.fallbacks)) ? `
  <div class="card">
    <div class="card-head"><span class="card-head-label">Caveats passed to the answer</span></div>
    <ul class="dc-notes">
      ${(d.notes || []).map(n => `<li>${esc(n)}</li>`).join('')}
      ${d.d2 && (d.d2.calls || d.d2.cache_hits || d.d2.fallbacks) ? `<li class="muted">D2 removal check (LLM: is "removal of …" the intervention or its opposite?): ${d.d2.calls} call${d.d2.calls === 1 ? '' : 's'}, ${d.d2.cache_hits} cached, ${d.d2.fallbacks} word-list fallback${d.d2.fallbacks === 1 ? '' : 's'}</li>` : ''}
    </ul>
  </div>` : ''}`;
}

function renderVoteTable(votes) {
  // group by paper so step 2 reads straight off step 1
  const order = [...votes].map((v, k) => ({v, k}))
    .sort((a, b) => (a.v.doc || '').localeCompare(b.v.doc || '') || a.k - b.k);
  let lastDoc = null;
  return `<table class="dv">
    <tr><th>Vote</th><th>Claim (subject → object)</th><th>Why</th><th class="n">weight</th><th>Paper</th></tr>
    ${order.map(({v, k}) => {
      const newDoc = v.doc !== lastDoc; lastDoc = v.doc;
      const f = v.factors || {};
      const ftip = Object.keys(f).length ? `comparator ${f.comparator} × language ${f.language} × design ${f.design} × strength ${f.strength}` : '';
      return `<tr class="dv-row${v.direction == null ? ' dv-dead' : ''}${newDoc ? ' dv-newdoc' : ''}" onclick="toggleVote(${k})">
        <td>${voteBadge(v.direction)}</td>
        <td class="dv-claim">${esc(v.subject || '?')}${v.subject_q ? ` <span class="et-q">[${esc(v.subject_q)}]</span>` : ''}
          <span class="dv-pred${v.negated ? ' neg' : ''}">${v.negated ? 'NOT ' : ''}${esc(v.predicate || '')}</span>
          ${esc(v.object || '?')}${v.object_q ? ` <span class="et-q">[${esc(v.object_q)}]</span>` : ''}
          ${v.flipped ? '<span class="ab-flag">subject flipped</span>' : ''}${v.head_to_head ? '<span class="ab-flag">head-to-head</span>' : ''}</td>
        <td class="dv-why">${esc(v.reason || '')}</td>
        <td class="n" title="${esc(ftip)}">${v.direction == null ? '–' : v.weight}</td>
        <td class="dv-doc" title="${esc(v.doc)}">${newDoc ? esc(shortDoc(v.doc)) : '<span class="muted">″</span>'}</td>
      </tr>
      <tr id="vd-${k}" class="dv-detail" style="display:none"><td></td><td colspan="4">
        ${v.sentence ? `<div class="ed-sent">“${esc(v.sentence)}”</div>` : ''}
        <div class="dv-meta">${esc(v.id)} · grade ${esc(v.grade || '?')}${ftip ? ' · ' + esc(ftip) : ''}</div>
      </td></tr>`;
    }).join('')}
  </table>
  <div class="pr-foot">Click a row for the source sentence. Excluded edges (mediates/moderates, interactions, “variation in Y”) are never cited.</div>`;
}

// --- Answer ----------------------------------------------------------------
function renderAnswer(ans, tok) {
  const ids = ans.edge_ids || [];
  const json = JSON.stringify(ans, null, 2);
  return `<div class="card answer-card">
    <div class="card-head"><span class="card-head-label">Final answer</span>
      ${statusBadge(ans.status)} ${ans.direction ? dirBadge(ans.direction) : ''}</div>
    <div class="answer-box big">${esc(ans.answer || '—')}</div>
    <div class="ans-grid">
      <div><span>direction</span><b>${esc(ans.direction ?? 'null')}</b></div>
      <div><span>certainty</span><b>${esc(ans.certainty ?? 'null')}</b></div>
      <div><span>confidence</span><b>${confMeter(ans.confidence)}</b></div>
      <div><span>edges cited</span><b>${ids.length}</b></div>
      <div><span>LLM tokens</span><b title="parse ${tok.parse||0} · ground ${tok.ground||0} · decide ${tok.decide||0} · check ${tok.uncertainty||0}">${(tok.total||0).toLocaleString()}</b></div>
    </div>
    ${ans.searched_for ? `<div class="pr-foot">Searched for: ${esc(ans.searched_for)}</div>` : ''}
    <details class="raw"><summary>answers.json entry</summary><pre>${esc(json)}</pre></details>
  </div>
  <div class="card">
    <div class="card-head"><span class="card-head-label">LLM tokens by stage</span><span class="ch-note">energy is scored on tokens</span></div>
    <div style="padding:10px 14px">
      ${tokBar('parse', tok.parse, tok.total)}
      ${tokBar('ground', tok.ground, tok.total)}
      ${tokBar('retrieve', 0, tok.total)}
      ${tokBar('decide', tok.decide, tok.total)}
      ${tok.uncertainty ? tokBar('parse check', tok.uncertainty, tok.total) : ''}
    </div>
  </div>`;
}
</script>
</body>
</html>
