- id: c7
  kind: outcome_trajectories
  question: >-
    How long do created marshes take to reach biodiversity and function comparable
    to natural reference wetlands, and which attributes lag?
  status: answered
  answer: >-
    Created marshes aren't in the graph; the closest evidence is restored prairie
    wetlands. Plant species richness in restored wetlands stays below natural reserve
    wetlands even 20–30 years after restoration, while non-native cover doesn't
    differ with wetland age. Restored riparian soils have lower microbial biomass,
    evenness and diversity than reference sites. The graph gives no time-to-equivalence
    estimate.
  direction: decrease
  confidence: 0.45
  certainty: low
