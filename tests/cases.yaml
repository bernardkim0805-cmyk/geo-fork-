- id: c4-modified
  kind: intervention_outcomes
  question: >-
    For tree planting in Canadian forest restoration, how do planting-stock traits
    (seedling size, nursery fertilization, mycorrhizal inoculation) affect survival
    and growth, and how do competing vegetation and site preparation change that?
  status: answered
  answer: >-
    Mostly positive for growth, weak for survival. Fertilization (including nursery
    exponential loading) increases height, diameter and biomass in most of 11 studies,
    but often only for black spruce, not jack pine or tamarack, and one study found
    Forest Pak fertilization raised seedling mortality. Mycorrhizal inoculation
    evidence is thin and mixed (5 studies). Seedling size has 1–2 studies: taller
    stock grows more. Controlling competing vegetation and site preparation (scarification,
    mounding) consistently increase growth and usually survival.
  direction: mixed
  confidence: 0.6
  certainty: moderate
