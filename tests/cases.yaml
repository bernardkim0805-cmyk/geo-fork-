- id: b5
  kind: intervention_outcomes
  question: >-
    Where restoration sites face several stressors at once (for example deer browsing
    plus competing vegetation, harvesting plus drought, or repeated fires), do the
    stressors interact, and which one most limits recovery?
  status: answered
  answer: >-
    The graph has very little interaction evidence. Stressors are almost always
    studied one at a time (deer browsing, competing vegetation, fire, harvesting
    separately). The few combined results: release from competition plus liming
    increased beech growth where liming alone did not, fire history interacted with
    microtopography for black spruce recruitment, and lake history moderated copepod
    responses to pH. Nothing ranks which stressor most limits recovery.
  direction: unclear
  confidence: 0.6
  certainty: very_low
