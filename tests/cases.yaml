- id: b4
  kind: intervention_outcomes
  question: >-
    What lethal and sub-lethal effects do contaminants such as oil sands tailings,
    PCBs and acid deposition have on wildlife and aquatic communities, and do remediation
    actions allow them to recover?
  status: answered
  answer: >-
    Harm is documented, recovery is partial. Oil sands tailings: tree swallow nestlings
    had lower weight, smaller broods, higher mortality risk and elevated EROD (sub-lethal),
    but clutch size and hatching success were unaffected. Acidification and acid
    mine drainage reduce zooplankton richness and invertebrate presence. Recovery:
    lake neutralization brought back acid-sensitive mayflies and lower metals raised
    zooplankton richness, but the Sydney Tar Ponds remediation showed no change
    in PCB, PAH or metal levels in rock crabs. PCB evidence is limited to tissue
    concentrations, not effects.
  direction: decrease
  confidence: 0.55
  certainty: low
