- id: c16-modified
  kind: graph
  question: >-
    For grassland restoration in Canada, which intervention-outcome combinations
    have little or no evidence, and where is the graph densest?
  status: answered
  answer: >-
    Of 643 intervention claims in grassland contexts (32 papers), evidence is densest
    for herbicide, seeding and mowing effects on native plants, invasive species
    and plant cover. Gaps: grazing has no grassland intervention edges at all (the
    graph's grazing claims are in salt marshes), and no grassland intervention is
    linked to wildlife or insect outcomes. Burning and tillage have few studies,
    and soil outcomes are sparse throughout.
  direction: unclear
  confidence: 0.7
  certainty: moderate
  edge_ids: []
  searched_for: null
  extras:
  - outputs/c16_grassland_gap_map.csv
- id: b1
  kind: intervention_outcomes
  question: >-
    Which forestry practices (partial harvesting versus clearcutting, retained woody
    debris, riparian retention) maintain biodiversity or speed its recovery in Canadian
    forests?
  status: answered
  answer: >-
    Mixed, low certainty, almost all associational. Retained woody debris is consistently
    linked to more small mammals and plant cover. Partial harvesting and clearcutting
    both raise total plant richness, but through exotic, ruderal and wind-dispersed
    species, while spring geophytes, mosses and old-growth species decline. Riparian
    retention has one edge (30-m reserves still had the lowest shredder richness
    among logged sites). No study in the graph compares partial harvest directly
    with clearcutting on biodiversity.
  direction: mixed
  confidence: 0.55
  certainty: low
