- id: b3
  kind: intervention_outcomes
  question: >-
    When herbicides such as glyphosate are used against invasive plants in grassland
    restoration, do they also reduce native plant cover and richness?
  status: answered
  answer: >-
    Mostly no: in 5 of 8 studies, herbicide used against invasive plants increased
    native cover or richness, usually by releasing natives from competition, and
    many results were null in some years or sites. The exception is direct harm
    to native forbs: an Alberta glyphosate trial reduced native forb cover and richness,
    and one forest study found incomplete exotic control made native densities worse.
  direction: mixed
  confidence: 0.65
  certainty: moderate
