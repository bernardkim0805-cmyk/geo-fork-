- id: b2
  kind: intervention_outcomes
  question: >-
    Which restoration actions, such as peatland rewetting, moss layer transfer or
    salt marsh realignment, turn degraded sites back into carbon sinks, and what
    happens to methane emissions?
  status: answered
  answer: >-
    For peatlands, yes with caveats: moss layer transfer shifted bare peat from
    a net carbon source to a sink, and restoration raised gross photosynthesis and
    lowered global warming potential. Methane tends to rise: restoration treatments
    and higher water tables are linked to higher methane flux. There is no carbon
    or methane evidence for salt marsh realignment.
  direction: increase
  confidence: 0.6
  certainty: low
