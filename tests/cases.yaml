- id: c13-modified
  kind: prioritization
  question: >-
    After wildfire in boreal forests, what controls natural conifer regeneration
    (fire interval, fire severity, seed supply, seedbed type), and which conditions
    signal that regeneration will fail without active restoration?
  status: answered
  answer: >-
    Partial evidence, mostly associational. Long-interval fire history is associated
    with more black spruce seedlings and recruits; higher fire severity with denser
    jack pine regeneration; greater distance to seed trees with lower stocking;
    and seedbed matters (lichen seedbeds and mat removal reduce black spruce establishment;
    rotten wood helps). The graph has no direct edge on short fire intervals or
    a threshold signalling regeneration failure.
  direction: mixed
  confidence: 0.5
  certainty: low
