# Decide-only test cases (docs/decide_tasks.md A1/A2).
#
# Each case is ONE question in hidden-set shape ("What effect does X have on Y?")
# plus the edge_ids retrieve would hand to decide. The harness
# (tests/eval_decide.py) feeds `edge_ids` straight into decide(), skipping
# parse/ground/retrieve, and compares the result to `expected`.
#
# Fields
#   id, question, intervention, outcome   -> become the Query
#   edge_ids        the INPUT to decide (may include edges that should NOT count)
#   expected:
#     status        answered | no_evidence
#     direction     increase | decrease | no_effect | mixed | unclear | null
#     certainty     high | moderate | low | very_low | null
#     cited_edges   edges an honest answer may cite (decide's citations must be a subset)
#   trap            which misreading the case is meant to catch (null = ordinary case)
#   labeled_by      who wrote the expected answer
#   checked_by      reviewers who agreed (subagent checks + user sign-off)
#   status_review   draft | checked | signed_off
#   decided_by      set when reviewers disagreed and the user picked the label
#   notes           why the answer is what it is
#
# For empty edge_ids, the label is no_evidence by contract (decide trusts retrieve).
# Per-case labeled_by / checked_by / status_review fall back to `defaults`.

defaults: {labeled_by: claude, checked_by: [subagent-1, subagent-2, subagent-3, user], status_review: signed_off}
# known_limit: the signed-off answer needs reading the sentence (the encoding hides it);
#   decide is expected to miss these, and the harness reports them separately.

cases:

# ---------------------------------------------------------------- ordinary
- id: DC-01
  question: What effect does herbicide application have on native plant cover?
  intervention: herbicide application
  outcome: native plant cover
  edge_ids: [camo:edge_2ebf9473095d, camo:edge_5988918f25b5, camo:edge_73525954fd38,
             camo:edge_fdb87e11c913, camo:edge_5be82b577166, camo:edge_2d3f3a554991,
             camo:edge_20dc6a868d10, camo:edge_88183e8dd33d, camo:edge_6e8cc3332878,
             camo:edge_27324a3c69c5]
  expected: {status: answered, direction: increase, certainty: moderate, cited_edges: all}
  trap: null
  notes: >-
    Two randomized studies. One reports higher native cover with herbicide in most
    plot-years, with two null plot-years. The other reports higher total native cover.

