- id: DC-31
  question: What effect does scarification have on seedling density?
  intervention: scarification
  outcome: seedling density
  edge_ids: [camo:edge_46927215c07b, camo:edge_c7ae2928e403, camo:edge_cd8e9ccec7a2,
             camo:edge_dd348e8a86e7]
