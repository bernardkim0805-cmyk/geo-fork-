# ---------------------------------------------------------------- traps
- id: DC-14
  question: What effect does weed removal have on conifer seedling growth?
  intervention: weed removal
  outcome: conifer seedling growth
  edge_ids: [camo:edge_cf3dcfed8798, camo:edge_6c8bc7ff827e, camo:edge_22ae5b45f0c6]
  expected: {status: answered, direction: increase, certainty: moderate, cited_edges: all}
  trap: removal_question
  notes: >-
    Subject qualifier is 'removed', but the question itself asks about the removal,
    so there is NO sign flip: weed removal increases growth.

- id: DC-15
  question: What effect does competing vegetation have on conifer seedling growth?
  intervention: competing vegetation
  outcome: conifer seedling growth
  edge_ids: [camo:edge_cf3dcfed8798, camo:edge_6c8bc7ff827e, camo:edge_22ae5b45f0c6]
  expected: {status: answered, direction: decrease, certainty: moderate, cited_edges: all}
  trap: absence_subject
  notes: >-
    Same edges as DC-14. The question asks about the vegetation itself, so
    'weed removal -> more growth' means competing vegetation DECREASES growth.

- id: DC-16
  question: What effect does tree shelters have on deer browsing damage?
  intervention: tree shelters
  outcome: deer browsing damage
  edge_ids: [camo:edge_3aa4be6d9196]
  expected: {status: no_evidence, direction: null, certainty: null, cited_edges: []}
  trap: absence_subject
  known_limit: true
  decided_by: user  # reviewer 2's reading; reviewers 1 & 3 said decrease/low
  notes: >-
    The sentence compares deer browsing between SPECIES among unprotected trees; it never
    compares sheltered vs unsheltered trees, so it says nothing about shelters. The encoding
    ('absence of shelter -> increased browsing') suggests a decrease, which decide will output.
    Originally drafted as the absence-subject flip: -> increased browsing' means shelters DECREASE browsing.
    Reading only the object's sign would say increase.

