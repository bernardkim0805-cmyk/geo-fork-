  trap: interaction_subject
  known_limit: true
  decided_by: user  # reviewers 1 & 3 said mixed/low; reviewer 2 said no_evidence
  notes: >-
    Dev question D-005. Every subject is an interaction (scarification x year,
    x cutting, 'treatment and time'), and one object is a 'variation in'. The study IS about
    scarification (rehabilitating high-graded mixedwoods): conifer density lower with
    scarification under some cuts; birch/hardwoods/non-commercial higher after 15 years
    (edge_c7ae2928e403 is mis-encoded as 'decreased'). Ecologist answer: mixed. Decide excludes
    interactions (B3), so it is expected to miss this.
