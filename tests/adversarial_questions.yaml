- id: L01
  category: large_context
  question: 'My family has farmed the same 80 hectares outside Guelph since 1952. My grandfather grew mixed grain, my father switched to corn and soybeans in the 1980s, and over the years the soil got noticeably more acidic, especially on the sandy rise behind the barn where the old orchard used to be. We tried different tillage, changed fertilizer suppliers twice, and even brought in a consultant who took twelve soil cores in a grid. A neighbour swears by spreading agricultural lime every three years, another thinks it is a waste of money. So, in short: what effect does liming have on soil pH?'
- id: L02
  category: large_context
  question: Our restoration crew spent the 2025 field season in a degraded tallgrass prairie remnant of about 14 hectares. We surveyed 60 quadrats in June and again in August, recorded every species, estimated percent cover, photographed each plot, and logged soil moisture with handheld probes. The site has a long history of fire suppression, cattle grazing until 1998, and a dense invasion of smooth brome and Kentucky bluegrass along the old fence line. The land trust wants a defensible plan before the board meeting, and several members are nervous about chemicals near the creek. What effect does herbicide application have on native plant cover?
- id: L03
  category: large_context
  question: Climate policy in Canada has gone through several phases, from early voluntary programs to carbon pricing, to provincial disputes over jurisdiction, to recent debates about methane regulation in the oil and gas sector. Wildfire seasons have also become longer, with smoke reaching cities thousands of kilometres away, which has made many people suspicious of any deliberate burning at all. Land managers, meanwhile, argue that fire is a natural process that many ecosystems depend on. Setting all of that aside, what effect does prescribed burning have on invasive species abundance?
- id: L04
  category: large_context
  question: Peatlands store a third of the world's soil carbon while covering only a few percent of the land. In Canada many bogs were drained for forestry, agriculture, and horticultural peat extraction, and ditch networks were dug across them in the twentieth century. Restoration programs now block ditches, spread donor moss, and add straw mulch to protect the surface. Monitoring wells are installed in rows, and technicians record the distance from the surface down to the water every two weeks from May to October. What effect does peatland rewetting have on water table depth?
- id: L05
  category: large_context
  question: I volunteer with a birding club that runs a breeding bird survey along a 40 km route every June. We have noticed fewer bobolinks and meadowlarks in the hayfields over the past decade, and some members blame early mowing dates, others blame pesticides, cats, or just climate. The club is writing a letter to the township and wants to cite real evidence rather than opinions. What effect does mowing have on bird abundance?
- id: L06
  category: large_context
  question: In a boreal plantation established in 2014 we planted 1,600 black spruce and jack pine seedlings per hectare after harvest. By 2018 raspberry, aspen suckers, and bluejoint grass had overtopped many of them. Half the blocks received motor-manual brushing with clearing saws in 2019, the other half were left alone, and we measured height and diameter every fall. The forestry company wants to know whether to budget for more brushing. What effect does mechanical release have on conifer seedling growth?
- id: L07
  category: large_context
  question: White-tailed deer populations in southern Ontario are far above historical levels. In our woodlot every unprotected seedling of oak, pine, and cedar gets browsed within a year, sometimes down to the root collar. We have priced fencing, repellents, and plastic tubes; the tubes are cheapest but look ugly and some people say they cook the seedlings in summer. What effect do tree shelters have on seedling survival?
- id: L08
  category: large_context
  question: After a partial harvest in a mixedwood stand, the contractor offered to pile the slash and leave large logs scattered across the cutblock instead of chipping everything. A local naturalist group says this helps voles, mice, and shrews, which in turn feed owls and martens, while the company worries about fire risk and the look of the site. We need a short evidence summary for the public meeting. What effect does coarse woody debris retention have on small mammal abundance?
- id: L09
  category: large_context
  question: 'In fescue grasslands of the Rocky Mountain foothills, restoration practitioners have tried steaming, cutting, hand-pulling, and glyphosate to control non-native species like smooth brome, timothy, and Kentucky bluegrass. Each method has costs: steam is slow and expensive, cutting must be repeated, and glyphosate raises concerns among neighbours and in the media. Grant funders want to see which methods actually work before renewing the project for three more years. What effect does herbicide application have on invasive / non-native species abundance?'
- id: L10
  category: large_context
  question: Beavers were nearly trapped out of much of Canada by the 1900s and have since recovered in many regions. Their dams flood valleys, create wetlands, raise water tables, kill trees, and change the whole landscape for decades. Some conservation groups now reintroduce them deliberately, and others build beaver dam analogues where beavers cannot yet live. What effect does beaver reintroduction have on songbird abundance?
